<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta property="og:title" content="Mostafa & Sarah Engagement Invitation">
<meta property="og:description" content="Join us for our special day - 6th June 2026">
<meta property="og:image" content="https://mostafa-hala.github.io/mostafa-sarah/images/preview.jpg">
<meta property="og:url" content="https://mostafa-hala.github.io/mostafa-sarah/">
<meta property="og:type" content="website">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Mostafa & Sarah Engagement Invitation">
<meta name="twitter:description" content="Join us for our special day - 6th June 2026">
<meta name="twitter:image" content="https://mostafa-hala.github.io/mostafa-sarah/images/preview.jpg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mostafa & Sarah | Engagement</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #fffaf7;
      color: #3b1d12;
      overflow-x: hidden;
    }

    /*
      LOCAL IMAGES:
      images/envelope.png  -> envelope cover
      images/hero.png      -> first invitation design
      images/location.png  -> location/reference design
      images/final.png     -> final design
    */

    :root {
      --brown-dark: #321309;
      --brown: #4d2113;
      --brown-soft: #7b452f;
      --rose: #e8c7ba;
      --cream: #fff8f3;
      --gold: #c89b72;
    }

    .cover-page {
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 20%, rgba(232,199,186,0.45), transparent 32%),
        linear-gradient(180deg, #fffdfb, #fff5ef);
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .cover-page::before,
    .cover-page::after {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200,155,114,0.26), transparent 65%);
      filter: blur(2px);
    }

    .cover-page::before {
      top: -80px;
      left: -100px;
    }

    .cover-page::after {
      bottom: -110px;
      right: -80px;
    }

    .cover-bg-noise {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(#4b2a1e22 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.35;
      pointer-events: none;
    }

    .cover-card {
      z-index: 2;
      width: min(92vw, 800px);
      padding: 24px 18px 34px;
      border-radius: 34px;
      background: rgb(255,255,255);
      border: 1px solid rgb(200,155,114);
      box-shadow: 0 28px 80px rgba(50, 20, 8, 0.16);
      backdrop-filter: blur(10px);
      text-align: center;
    }

    .small-script {
      font-size: clamp(25px, 8vw, 42px);
      font-style: italic;
      font-weight: 400;
      color: var(--brown-soft);
      margin-bottom: 14px;
    }

    .envelope-button {
      border: none;
      background: transparent;
      cursor: pointer;
      text-align: center;
      animation: float 3.5s ease-in-out infinite;
    }

    .envelope-button img {
      width: min(78vw, 362px);
      display: block;
      margin: auto;
      filter: drop-shadow(0 24px 24px rgba(50, 20, 8, 0.28));
    }

    .open-text {
      margin-top: 30px;
      font-size: 15px;
      letter-spacing: 4px;
      color: #4b281b;
      text-transform: uppercase;
    }

    .hint-text {
      margin-top: 12px;
      font-size: 13px;
      color: rgba(75, 40, 27, 0.68);
      line-height: 1.7;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .main-content {
      display: none;
      animation: fadeIn 0.9s ease forwards;
    }

    .main-content.show {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .section-label {
      position: absolute;
      left: 50%;
      top: 22px;
      transform: translateX(-50%);
      z-index: 3;
      color: rgba(255,255,255,0.92);
      background: rgba(50,19,9,0.35);
      border: 1px solid rgba(255,255,255,0.18);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      backdrop-filter: blur(10px);
      white-space: nowrap;
    }

    .full-image-section {
      width: 100%;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      background: #f7eee8;
    }

    .full-image-section::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(0,0,0,0.08), transparent 25%, transparent 72%, rgba(0,0,0,0.08));
    }

    .full-image-section img {
      width: 100%;
      height: 100vh;
      object-fit: cover;
      display: block;
      transform: scale(1.08);
      opacity: 0;
      filter: blur(10px);
      transition: transform 1.4s ease, opacity 1.2s ease, filter 1.2s ease;
    }

    .full-image-section.show-image img {
      transform: scale(1);
      opacity: 1;
      filter: blur(0);
    }

    .full-image-section .section-label,
    .full-image-section .tap-location {
      opacity: 0;
      transition: opacity 0.9s ease 0.45s, transform 0.9s ease 0.45s;
    }

    .full-image-section .section-label {
      transform: translate(-50%, -18px);
    }

    .full-image-section .tap-location {
      transform: translate(-50%, 18px);
    }

    .full-image-section.show-image .section-label {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .full-image-section.show-image .tap-location {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .countdown-card {
      opacity: 0;
      transform: translateY(28px) scale(0.96);
      transition: opacity 1s ease, transform 1s ease;
    }

    .countdown-section.show-countdown .countdown-card {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .countdown-section {
      min-height: 58vh;
      width: 100%;
      padding: 62px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background:
        radial-gradient(circle at 20% 15%, rgba(200,155,114,0.24), transparent 28%),
        radial-gradient(circle at 80% 85%, rgba(232,199,186,0.46), transparent 30%),
        linear-gradient(180deg, #fffaf7, #f1d9cf);
      position: relative;
      overflow: hidden;
    }

    .countdown-section::before {
      content: "06 · 06 · 2026";
      position: absolute;
      font-size: clamp(54px, 18vw, 160px);
      letter-spacing: 6px;
      color: rgba(77,33,19,0.045);
      white-space: nowrap;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .countdown-card {
      position: relative;
      z-index: 2;
      width: min(92vw, 760px);
      padding: 42px 20px;
      border: 1px solid rgba(89, 43, 27, 0.18);
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.48);
      box-shadow: 0 24px 70px rgba(64, 26, 13, 0.14);
      backdrop-filter: blur(12px);
    }

    .countdown-card::before {
      content: "";
      display: block;
      width: 72px;
      height: 1px;
      background: var(--gold);
      margin: 0 auto 22px;
    }

    .script-title {
      font-size: clamp(27px, 8vw, 50px);
      font-style: italic;
      font-weight: 400;
      margin-bottom: 18px;
      color: #5a2a1b;
    }

    .event-date {
      font-size: clamp(17px, 4.5vw, 24px);
      letter-spacing: 4px;
      margin-bottom: 30px;
      color: #2d130c;
    }

    .timer {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .time-box {
      padding: 18px 6px;
      border-radius: 20px;
      background: linear-gradient(180deg, #5d2c1c, #351408);
      color: #fff4ee;
      box-shadow: 0 14px 28px rgba(75, 33, 20, 0.2);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .time-box span {
      display: block;
      font-size: clamp(24px, 7vw, 44px);
      line-height: 1;
      margin-bottom: 8px;
    }

    .time-box small {
      font-size: clamp(9px, 2.8vw, 13px);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      opacity: 0.82;
    }

    .location-link {
      display: block;
      cursor: pointer;
      text-decoration: none;
    }

    .tap-location {
      position: absolute;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      z-index: 4;
      background: rgba(255, 250, 247, 0.84);
      color: #3b1d12;
      padding: 13px 20px;
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.14);
      white-space: nowrap;
    }

    .tap-location::before {
      content: "📍";
      margin-right: 8px;
      letter-spacing: 0;
    }


    /* ===== Car opening animation after envelope click ===== */
    .cover-page.hide-cover {
      animation: coverFadeOut 0.55s ease forwards;
    }

    @keyframes coverFadeOut {
      to {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }
    }

    .car-opening {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      opacity: 0;
      transition: opacity 1.25s ease;
      background:
        radial-gradient(circle at 50% 42%, rgba(232,199,186,0.5), transparent 34%),
        linear-gradient(180deg, #fffdfb, #fff5ef);
    }

    .car-opening.show {
      display: flex;
      opacity: 1;
    }

    .car-opening.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .car-opening::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(#4b2a1e20 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.34;
    }

    .opening-car {
      position: relative;
      z-index: 2;
      width: min(72vw, 420px);
      max-height: 82vh;
      object-fit: contain;
      filter: drop-shadow(0 28px 30px rgba(50, 20, 8, 0.22));
      opacity: 0;
      transform: translateY(18vh) scale(0.88);
    }

    .car-opening.show .opening-car {
      animation:
        carAppear 1.15s ease forwards,
        carMoveToTop 4.2s cubic-bezier(.35, 0, .15, 1) 1.1s forwards;
    }

    @keyframes carAppear {
      to {
        opacity: 1;
        transform: translateY(4vh) scale(1);
      }
    }

    @keyframes carMoveToTop {
      0% {
        opacity: 1;
        transform: translateY(4vh) scale(1);
      }
      75% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(-118vh) scale(0.54);
      }
    }

    .car-opening-text {
      position: absolute;
      bottom: 52px;
      z-index: 3;
      color: var(--brown-soft);
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0;
      animation: textSoftIn 0.7s ease 0.25s forwards;
    }

    @keyframes textSoftIn {
      to { opacity: 0.82; }
    }

    .main-content {
      opacity: 0;
      transform: translateY(34px) scale(0.985);
      transition: opacity 1.6s ease, transform 1.6s cubic-bezier(.22, 1, .36, 1);
    }

    .main-content.ready {
      opacity: 1;
      transform: translateY(0);
    }

    body.no-scroll {
      overflow: hidden;
    }

    @media (max-width: 600px) {
      .cover-page {
        padding: 16px;
      }

      .cover-card {
        padding: 20px 12px 30px;
        border-radius: 28px;
      }

      .envelope-button img {
        width: min(88vw, 330px);
      }

      .open-text {
        font-size: 13px;
        letter-spacing: 3px;
      }

      .hint-text {
        font-size: 12px;
        padding: 0 10px;
      }

      .section-label {
        top: 16px;
        font-size: 9px;
        letter-spacing: 2px;
        padding: 9px 13px;
      }

      .full-image-section img {
        height: 100vh;
        
      }

      .countdown-section {
        min-height: 52vh;
        padding: 46px 14px;
      }

      .countdown-card {
        padding: 34px 14px;
        border-radius: 26px;
      }

      .timer {
        gap: 8px;
      }

      .time-box {
        padding: 15px 4px;
        border-radius: 15px;
      }

      .tap-location {
        bottom: 22px;
        font-size: 11px;
        padding: 12px 16px;
      }
    }
  </style>
</head>
<body>
  <section id="cover" class="cover-page">
    <div class="cover-bg-noise"></div>

    <div class="cover-card">
      <div class="small-script">You are invited</div>

      <button class="envelope-button" onclick="openInvitation()" aria-label="Open the invitation">
        <img src="images/envelope.png" alt="Engagement Envelope" />
        <div class="open-text">Open The Envelope</div>
      </button>

      <p class="hint-text">Tap the envelope to reveal the engagement invitation</p>
    </div>
  </section>


  <div id="carOpening" class="car-opening" aria-hidden="true">
    <img class="opening-car" src="images/car.png" alt="Wedding Car" />
    <div class="car-opening-text">Our journey begins</div>
  </div>

  <main id="mainContent" class="main-content">
    <section class="full-image-section">
      <div class="section-label">Mostafa & Sarah</div>
      <img src="images/hero.png" alt="Mostafa and Sarah Engagement" />
    </section>

    <section class="countdown-section">
      <div class="countdown-card">
        <h2 class="script-title">Counting down to our Engagement</h2>
        <div class="event-date">06.06.2026 · 7:00 PM</div>

        <div class="timer">
          <div class="time-box">
            <span id="days">00</span>
            <small>Days</small>
          </div>
          <div class="time-box">
            <span id="hours">00</span>
            <small>Hours</small>
          </div>
          <div class="time-box">
            <span id="minutes">00</span>
            <small>Minutes</small>
          </div>
          <div class="time-box">
            <span id="seconds">00</span>
            <small>Seconds</small>
          </div>
        </div>
      </div>
    </section>

    <a
      class="location-link"
      href="https://www.google.com/maps/search/?api=1&query=Steigenberger%20Cecil%20Alexandria%2C%20Raml%20Station%2C%2016%20Saad%20Zaghloul%20Square%2C%20Al%20Mesallah%20Gharb%20WA%20Sharif%20Basha%2C%20Al%20Attarin%2C%20Alexandria%20Governorate%2021500"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open location on Google Maps"
    >
      <section class="full-image-section">
        <div class="section-label">Steigenberger Cecil Alexandria</div>
        <img src="images/location.png" alt="Engagement Location" />
        <div class="tap-location">Tap for direction</div>
      </section>
    </a>

    <section class="full-image-section">
      <div class="section-label">Formal invitation to follow</div>
      <img src="images/final.png" alt="Final Invitation Section" />
    </section>
  </main>

  <script>
    let invitationOpened = false;

    function openInvitation() {
      if (invitationOpened) return;
      invitationOpened = true;

      const cover = document.getElementById('cover');
      const main = document.getElementById('mainContent');
      const carOpening = document.getElementById('carOpening');

      document.body.classList.add('no-scroll');
      cover.classList.add('hide-cover');

      setTimeout(() => {
        cover.style.display = 'none';
        carOpening.classList.add('show');
        window.scrollTo({ top: 0, behavior: 'instant' });
      }, 520);

      setTimeout(() => {
        main.classList.add('show');
        carOpening.classList.add('fade-out');

        setTimeout(() => {
          main.classList.add('ready');
        }, 120);

        document.querySelectorAll('.full-image-section, .countdown-section').forEach((section) => {
          revealObserver.observe(section);
        });
      }, 1600);

      setTimeout(() => {
        carOpening.classList.remove('show', 'fade-out');
        document.body.classList.remove('no-scroll');
      }, 3050);
    }

    const targetDate = new Date('2026-06-06T19:00:00+03:00').getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance <= 0) {
        document.getElementById('days').textContent = '00';
        document.getElementById('hours').textContent = '00';
        document.getElementById('minutes').textContent = '00';
        document.getElementById('seconds').textContent = '00';
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = String(days).padStart(2, '0');
      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    const animatedSections = document.querySelectorAll('.full-image-section, .countdown-section');

    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          if (entry.target.classList.contains('full-image-section')) {
            entry.target.classList.add('show-image');
          }

          if (entry.target.classList.contains('countdown-section')) {
            entry.target.classList.add('show-countdown');
          }
        }
      });
    }, {
      threshold: 0.28
    });

    animatedSections.forEach((section) => revealObserver.observe(section));
  </script>
</body>
</html>
